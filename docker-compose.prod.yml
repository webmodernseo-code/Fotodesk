version: '3.9'

# Canonical FotoDesk production Compose manifest.
# Requires POSTGRES_PASSWORD in root .env / environment and backend/.env.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fotodesk_prod}
      POSTGRES_USER: ${POSTGRES_USER:-fotodesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - fotodesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fotodesk} -d ${POSTGRES_DB:-fotodesk_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: fotodesk-backend:${FOTODESK_VERSION:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      STORAGE_PATH: /app/uploads
      PHOTOS_DIR: /app/uploads/events
      BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - fotodesk_uploads:/app/uploads
      - fotodesk_backups:/app/backups
    command: sh -c "npm run migrate && node server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    image: fotodesk-frontend:${FOTODESK_VERSION:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  fotodesk_pgdata:
  fotodesk_uploads:
  fotodesk_backups:

